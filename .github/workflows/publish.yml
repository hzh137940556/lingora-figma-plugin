name: Publish channel release
on:
  push:
    branches: ['release/develop-v*', 'release/main-v*']
    paths: [release.json, plugin.tar.gz]
permissions:
  contents: write
concurrency:
  group: figma-release-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  publish:
    if: startsWith(github.ref_name, 'release/develop-v') || (startsWith(github.ref_name, 'release/main-v') && vars.FIGMA_STABLE_RELEASE_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ARTIFACT_REF: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    outputs:
      channel: ${{ steps.artifact.outputs.channel }}
      artifact_sha: ${{ steps.artifact.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate immutable artifact branch
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_REF" =~ ^release/(develop|main)-v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]
          channel=$(jq -er '.channel' release.json)
          version=$(jq -er '.version' release.json)
          test "$ARTIFACT_REF" = "release/$channel-v$version"
          echo "CHANNEL=$channel" >> "$GITHUB_ENV"
          echo "ARTIFACT_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.mjs
      - run: node scripts/package-release.mjs
      - name: Publish without replacing existing assets
        shell: bash
        run: |
          set -euo pipefail
          version=$(jq -er '.version' release.json)
          tag="v$version"
          if ! gh release view "$tag" --json isDraft >/dev/null 2>&1; then
            args=()
            if [ "$CHANNEL" = develop ]; then args+=(--prerelease); fi
            gh release create "$tag" --target "$ARTIFACT_SHA" --draft --title "Lingora Figma $version" --notes "渠道：$CHANNEL。支持 macOS / Figma 126.x。" "${args[@]}"
          fi
          mkdir -p downloaded
          for file in lingora-figma-macos.tar.gz SHA256SUMS latest.json install.sh; do
            if gh release view "$tag" --json assets --jq '.assets[].name' | grep -qx "$file"; then
              gh release download "$tag" --pattern "$file" --output "downloaded/$file"
              cmp "downloaded/$file" "dist/$file"
            else
              test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true
              gh release upload "$tag" "dist/$file"
            fi
          done
          if [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true ]; then
            gh release edit "$tag" --draft=false --latest="$([ "$CHANNEL" = main ] && echo true || echo false)"
          fi
          echo "https://github.com/$GH_REPO/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"

  verify-installation:
    needs: publish
    uses: ./.github/workflows/macos-smoke.yml
    with:
      channel: ${{ needs.publish.outputs.channel }}
      artifact_sha: ${{ needs.publish.outputs.artifact_sha }}
    permissions:
      contents: read
